<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form action="#" method="post">
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required placeholder="usuario@ejemplo.com"/>
        </div>
        <div>
            <label for="telefono">Telefono</label>
            <input type="tel" name="telefono" id="telefono" title="Ingresa 9 dígitos" placeholder="123456789" 
            pattern="[0-9]{9}"/>
        </div>
        <div>
            <label for="cantidad">Cantidad</label>
            <input type="number" name="cantidad" id="cantidad" min="1" max="100" step="5" value="10"/>
        </div>
        <div>
            <label for="fecha">Fecha</label>
            <input type="date" name="fecha" id="fecha" min="2024-01-01" max="2024-12-31"/>
        </div>
        <div>
            <label for="password">Contraseña (minimo 8 caracteres)</label>
            <input type="password" name="password" id="password" placeholder="Mínimo 8 caracteres" required minlength="8">
        </div>
        <button type="submit">Enviar</button>

    </form>
    
</body>
</html>
