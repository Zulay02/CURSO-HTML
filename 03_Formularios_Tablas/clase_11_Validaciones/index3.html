<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario con Tema Claro/Oscuro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    form {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      transition: background 0.3s, color 0.3s;
    }
    div {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    input:invalid {
      border-color: red;
    }
    .error {
      color: #cc6666;
      font-size: 0.9em;
      display: none;
    }
    input:invalid + .error {
      display: block;
    }
    button {
      background: #007BFF;
      color: #fff;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0056b3;
    }

    /* Tema oscuro */
    body.dark {
      background: #121212;
      color: #f1f1f1;
    }
    body.dark form {
      background: #1e1e1e;
      color: #f1f1f1;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }
    body.dark input {
      background: #2a2a2a;
      color: #f1f1f1;
      border: 1px solid #555;
    }
    body.dark .error {
      color: #ff9999;
    }
    body.dark button {
      background: #28a745;
    }
    body.dark button:hover {
      background: #1e7e34;
    }

    /* Botón de alternar tema */
    #toggleTheme {
      display: block;
      margin: 20px auto;
      background: #6c757d;
      color: #fff;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
    }
    #toggleTheme:hover {
      background: #5a6268;
    }
  </style>
</head>
<body>
  <button id="toggleTheme">Cambiar a modo oscuro</button>

  <form action="#" method="post" novalidate>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required placeholder="usuario@ejemplo.com">
      <span class="error">Por favor ingresa un correo válido.</span>
    </div>
    <div>
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" placeholder="123456789" required>
      <span class="error">Debe contener exactamente 9 dígitos.</span>
    </div>
    <div>
      <label for="cantidad">Cantidad</label>
      <input type="number" id="cantidad" name="cantidad" min="1" max="100" step="5" value="10" required>
      <span class="error">Ingresa un número entre 1 y 100.</span>
    </div>
    <div>
      <label for="fecha">Fecha</label>
      <input type="date" id="fecha" name="fecha" min="2024-01-01" max="2024-12-31" required>
      <span class="error">Selecciona una fecha válida dentro del rango.</span>
    </div>
    <div>
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" minlength="8" required 
             pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}" 
             placeholder="Mínimo 8 caracteres">
      <span class="error">Debe tener al menos 8 caracteres, una mayúscula, una minúscula y un número.</span>
    </div>
    <button type="submit">Enviar</button>
  </form>

  <script>
    const toggleBtn = document.getElementById('toggleTheme');
    toggleBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      toggleBtn.textContent = document.body.classList.contains('dark') 
        ? 'Cambiar a modo claro' 
        : 'Cambiar a modo oscuro';
    });
  </script>
</body>
</html>
