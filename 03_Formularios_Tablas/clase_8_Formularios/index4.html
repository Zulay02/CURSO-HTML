<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Responsive</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    form {
      background: #fff;
      padding: 20px 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    form h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    div {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      transition: border-color 0.3s;
      font-size: 14px;
    }

    input:focus {
      border-color: #007BFF;
      outline: none;
    }

    .error {
      color: red;
      font-size: 13px;
      margin-top: 5px;
      display: none; /* Oculto por defecto */
    }

    button {
      width: 100%;
      padding: 12px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    /* 📱 Responsive */
    @media (max-width: 480px) {
      body {
        padding: 10px;
      }

      form {
        padding: 15px;
      }

      input, button {
        font-size: 14px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <form id="miFormulario" action="#" method="post">
    <h2>Registro</h2>

    <div>
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" name="nombre" required minlength="3" maxlength="30" placeholder="Escribe tu nombre">
      <span id="errorNombre" class="error">El nombre debe tener al menos 3 caracteres.</span>
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" type="email" name="email" required placeholder="ejemplo@correo.com">
      <span id="errorEmail" class="error">Por favor ingresa un correo electrónico válido.</span>
    </div>

    <button type="submit">Enviar</button>
  </form>

  <script>
    document.getElementById("miFormulario").addEventListener("submit", function(event) {
      let valido = true;

      const nombre = document.getElementById("nombre").value.trim();
      const email = document.getElementById("email").value.trim();

      const errorNombre = document.getElementById("errorNombre");
      const errorEmail = document.getElementById("errorEmail");

      // Ocultar errores previos
      errorNombre.style.display = "none";
      errorEmail.style.display = "none";

      // Validación de nombre
      if (nombre.length < 3) {
        errorNombre.style.display = "block";
        valido = false;
      }

      // Validación de email con regex
      const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!regexEmail.test(email)) {
        errorEmail.style.display = "block";
        valido = false;
      }

      if (!valido) {
        event.preventDefault(); // Evita envío si hay errores
      }
    });
  </script>
</body>
</html>
