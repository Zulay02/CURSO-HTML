<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Moderno</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            width: 350px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="color"] {
            width: 100%;
            border: none;
            border-bottom: 2px solid #ccc;
            padding: 10px 5px;
            font-size: 16px;
            background: transparent;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-bottom: 2px solid #4CAF50;
        }

        label {
            position: absolute;
            top: 10px;
            left: 5px;
            font-size: 16px;
            color: #777;
            pointer-events: none;
            transition: 0.3s ease all;
        }

        input:focus + label,
        input:valid + label {
            top: -10px;
            font-size: 12px;
            color: #4CAF50;
        }

        fieldset {
            border: none;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #43a047;
        }
    </style>
</head>
<body>

    <form action="#" method="post">
        <h2>Registro</h2>

        <div class="input-group">
            <input type="password" name="password" id="password" required>
            <label for="password">Contraseña</label>
        </div>

        <div class="input-group">
            <input type="number" name="edad" id="edad" min="18" max="70" required>
            <label for="edad">Edad</label>
        </div>

        <div class="input-group">
            <input type="date" name="fecha" id="fecha" required>
            <label for="fecha">Fecha</label>
        </div>

        <div class="input-group">
            <input type="color" name="color" id="color" required>
            <label for="color">Color favorito</label>
        </div>

        <fieldset>
            <legend>Género</legend>
            <div class="radio-group">
                <div>
                    <input type="radio" name="genero" id="masculino" value="M" required>
                    <label for="masculino">Masculino</label>
                </div>
                <div>
                    <input type="radio" name="genero" id="femenino" value="F">
                    <label for="femenino">Femenino</label>
                </div>
            </div>
        </fieldset>

        <button type="submit">Enviar</button>
    </form>
    
</body>
</html>
