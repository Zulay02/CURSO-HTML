<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Toggle</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        form {
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            transition: background 0.3s, box-shadow 0.3s;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="color"] {
            width: 100%;
            border: none;
            border-bottom: 2px solid;
            padding: 10px 5px;
            font-size: 16px;
            background: transparent;
            transition: border-color 0.3s, color 0.3s;
        }

        input:focus {
            outline: none;
        }

        label {
            position: absolute;
            top: 10px;
            left: 5px;
            font-size: 16px;
            pointer-events: none;
            transition: 0.3s ease all;
        }

        input:focus + label,
        input:valid + label {
            top: -10px;
            font-size: 12px;
        }

        fieldset {
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            transition: border 0.3s;
        }

        legend {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        /* 🌞 Modo claro */
        body.light {
            background: #f0f2f5;
            color: #333;
        }
        body.light form {
            background: #fff;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        body.light input {
            border-bottom-color: #ccc;
            color: #333;
        }
        body.light input:focus {
            border-bottom-color: #4CAF50;
        }
        body.light label {
            color: #777;
        }
        body.light input:focus + label,
        body.light input:valid + label {
            color: #4CAF50;
        }
        body.light fieldset {
            border: 1px solid #ccc;
        }
        body.light legend {
            color: #555;
        }
        body.light button {
            background: #4CAF50;
            color: white;
        }
        body.light button:hover {
            background: #43a047;
        }

        /* 🌙 Modo oscuro */
        body.dark {
            background: #121212;
            color: #e0e0e0;
        }
        body.dark form {
            background: #1e1e1e;
            box-shadow: 0 6px 12px rgba(0,0,0,0.6);
        }
        body.dark input {
            border-bottom-color: #555;
            color: #e0e0e0;
        }
        body.dark input:focus {
            border-bottom-color: #4CAF50;
        }
        body.dark label {
            color: #888;
        }
        body.dark input:focus + label,
        body.dark input:valid + label {
            color: #4CAF50;
        }
        body.dark fieldset {
            border: 1px solid #444;
        }
        body.dark legend {
            color: #bbb;
        }
        body.dark button {
            background: #4CAF50;
            color: white;
        }
        body.dark button:hover {
            background: #43a047;
        }

        /* Botón de toggle */
        #toggle-theme {
            margin-top: 15px;
            background: #2196F3;
            color: white;
        }
        #toggle-theme:hover {
            background: #1976D2;
        }
    </style>
</head>
<body class="light">

    <form action="#" method="post">
        <h2>Registro</h2>

        <div class="input-group">
            <input type="password" name="password" id="password" required>
            <label for="password">Contraseña</label>
        </div>

        <div class="input-group">
            <input type="number" name="edad" id="edad" min="18" max="70" required>
            <label for="edad">Edad</label>
        </div>

        <div class="input-group">
            <input type="date" name="fecha" id="fecha" required>
            <label for="fecha">Fecha</label>
        </div>

        <div class="input-group">
            <input type="color" name="color" id="color" required>
            <label for="color">Color favorito</label>
        </div>

        <fieldset>
            <legend>Género</legend>
            <div class="radio-group">
                <div>
                    <input type="radio" name="genero" id="masculino" value="M" required>
                    <label for="masculino">Masculino</label>
                </div>
                <div>
                    <input type="radio" name="genero" id="femenino" value="F">
                    <label for="femenino">Femenino</label>
                </div>
            </div>
        </fieldset>

        <button type="submit">Enviar</button>
        <button type="button" id="toggle-theme">Cambiar tema</button>
    </form>

    <script>
        const toggleBtn = document.getElementById('toggle-theme');
        const body = document.body;

        toggleBtn.addEventListener('click', () => {
            body.classList.toggle('light');
            body.classList.toggle('dark');
        });
    </script>
    
</body>
</html>
