<!DOCTYPE html> <!-- Declara que el documento usa HTML5 -->
<html lang="en"> <!-- Define el idioma principal del contenido -->
<head>
    <meta charset="UTF-8"> <!-- Configura la codificación de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Hace que el sitio sea adaptable a móviles -->
    <title>Estructura Semántica</title> <!-- Título que aparece en la pestaña del navegador -->
</head>
<body> <!-- Contenido visible de la página -->

    <!-- HEADER: Encabezado del sitio -->
    <header>
        <h1>Mi sitio web</h1> <!-- Título principal del sitio -->
        <nav> <!-- Menú de navegación -->
            <ul>
                <li><a href="">Inicio</a></li> <!-- Enlace a la página principal -->
                <li><a href="">Servicio</a></li> <!-- Enlace a la sección de servicios -->
                <li><a href="">Contacto</a></li> <!-- Enlace a la sección de contacto -->
            </ul>
        </nav>
    </header>

    <!-- MAIN: Contenido principal -->
    <main>
        <section> <!-- Agrupa un bloque temático del contenido -->
            <article> <!-- Artículo independiente -->
                <p>Contenido del primer artículo.</p>
            </article>
            <article>
                <p>Contenido del segundo artículo.</p>
            </article>
            <article>
                <p>Contenido del tercer artículo.</p>
            </article>
        </section>

        <aside> <!-- Contenido complementario, como anuncios o enlaces -->
            <p>Información adicional o enlaces relacionados.</p>
        </aside>
    </main>

    <!-- FOOTER: Pie de página -->
    <footer>
        <p>© 2025 Mi sitio. Todos los derechos reservados.</p> <!-- Información legal o de autor -->
    </footer>

</body>
</html>
