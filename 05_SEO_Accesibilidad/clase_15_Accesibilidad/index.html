<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesibilidad</title>
</head>
<body>
    <!--Boton con icono de texto-->
    <button aria-label="Cerrar ventana">x</button>

    <!--Navegación sin título visible-->
    <header>
        <nav aria-label="Menú princpal">
            <a href="#inicio">Inicio</a>
            <a href="#productos"> Productos</a>
        </nav>
    </header>

    <!--Input cuando el label no es suficiente-->
    <input type="search" aria-label="Buscador de productos"/>

    <!--Campo con instrucciones-->
    <label for="password">contraseña</label>
    <input type="password" name="password" id="password"
    aria-describedby="password-help"/>
    <small id="password-help">Mínimo 8 caracteres ,incluy númros y letras</small>

    <!--Imagen compleja con descripción-->
    <img src="grafico.jpg" alt="Ventas 2024"
    aria-describedby="gráfica-descripción"/>
    <p>Las ventas aumentaron un 40% en el Q1</p>

    <!--Reegión principal-->
    <div role="main">
        <h3>Contenido principal de la seccion</h3>
        <p>Aqui va el contenido más importante de esta seccion </p>    
    </div>

    <!--Alertas importantes-->
    <div role="alert">Tu sección expirará n 5 minutos</div>

</body>
</html>
