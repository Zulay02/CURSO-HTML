    <!-- Reproductor de video con dos formatos disponibles -->
<video controls width="600" height="400">
    <!-- Fuente en formato MP4 -->
    <source src="multimedia/14954846_3840_2160_60fps.mp4" type="video/mp4">
    
    <!-- Fuente en formato MOV -->
    <source src="multimedia/video.mov" type="video/quicktime">
    
    <!-- Mensaje alternativo si el navegador no soporta video -->
    Tu navegador no soporta la reproducción de video.
</video>

    <audio src=""></audio>

    <audio controls preload="auto">
        <source src="MULTIMEDIA/audio.mp3" type="audio/mpeg">
        Tu navegador no soporta audio html5
    </audio>
